<div class="landing-page">
  <!-- ── Page Body ── -->
  <div class="page-body">

    <!-- Back Button -->
    <button type="button" class="back-btn" aria-label="Go back" (click)="goBack()">
      <img src="/assets/images/back-button.svg" alt="Back" />
    </button>

    <!-- Centred Content -->
    <div class="center-content">
      <img class="torch-logo" src="/assets/images/torch-logo.svg" alt="theTorch Logo" />

      <h1 class="welcome-title">Welcome!</h1>
      <p class="welcome-desc">
        Cycle, earn points and help<br />
        our community grow.<br />
        Let's build a better TU Wien<br />
        together.
      </p>
    </div>

    <!-- Log In / Register Buttons -->
    <div class="btn-row">
      <button class="btn-primary btn-login" routerLink="/login">Log In</button>
      <button class="btn-primary btn-register" routerLink="/register">Register</button>
    </div>

  </div>

</div>
